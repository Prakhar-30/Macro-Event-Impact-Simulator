services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: macroscope-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: macroscope
    ports:
      - "5432:5432"
    volumes:
      - macroscope-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: macroscope-redis
    ports:
      - "6379:6379"
    volumes:
      - macroscope-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  macroscope-pg-data:
  macroscope-redis-data:
